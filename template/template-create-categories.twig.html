{% extends 'template-parent-back.twig.html' %}

{% block titre %}Créer une catégorie{% endblock %}

{% block content %}
<div class="flex justify-center items-center">
  <form action="" method="POST" class="flex flex-col gap-4 w-1/2">
    <p class="text-2xl font-bold">Créer une catégorie</p>
    <input type="hidden" name="name" value="store_categorie">
    <label for="nom" class="input input-bordered flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 16 16"
        fill="currentColor"
        class="h-4 w-4 opacity-70">
        <path
          d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z" />
      </svg>
      <input type="text" name="nom" id="nom" required class="grow" placeholder="Nom" />
    </label>
    <button class="btn btn-primary" type="submit">Créer</button>
  </form>
</div>
{% endblock %}
