{% extends 'template-parent-back.twig.html' %}

{% block titre %}Créer un post{% endblock %}

{% block content %}
<label class="flex justify-center items-center">
  <form action="" method="POST" enctype="multipart/form-data" class="flex flex-col gap-4 w-1/2">
    <input type="hidden" name="name" value="store_post">
    <p class="text-2xl font-bold">Ajouter un post</p>
    <label for="titre" class="input input-bordered flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 16 16"
        fill="currentColor"
        class="h-4 w-4 opacity-70">
        <path
          d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z" />
        <path
          d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z" />
      </svg>
      <input type="text" name="titre" id="titre" required class="grow" placeholder="Titre" />
    </label>


    <label for="description"></label>
    <textarea name="description" id="description" required class="textarea textarea-bordered" placeholder="Description"></textarea>


    <label for="image">Télécharger une image</label>
    <input type="file" name="image" id="image" accept="image/*" required class="file-input file-input-bordered w-full max-w-xs">

    <label for="nom_categorie" class="">Choisir une catégorie</label>
    <select name="nom_categorie" id="nom_categorie" required class="select select-bordered w-full max-w-xs">
      {% for categorie in categories %}
      <option value="{{ categorie.nom }}">
        {{ categorie.nom }}
      </option>
      {% endfor %}
    </select>
    <button class="btn btn-primary" type="submit">Ajouter</button>
  </form>
  {% endblock %}
