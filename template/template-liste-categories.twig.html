{% extends 'template-parent-back.twig.html' %} {% block titre %}Liste des
categories{% endblock %} {% block content %}
<div class="overflow-x-auto">
  <table class="table">
    {% for categorie in categories %}
    <tr>
      <td>{{ categorie.nom }}</td>
      <td>
        <a
          class="btn btn-error"
          href="index.php?page=delete-categorie&id={{ categorie.id }}"
          >Supprimer</a
        >
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
